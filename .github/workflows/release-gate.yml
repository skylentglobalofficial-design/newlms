# Skylent final engineering gate.
# Runs the real toolchain, migrations on a throwaway Postgres, every test script and the learner journey.
# Triggered on pull requests to main and on demand.

#
# It uses a throwaway PostgreSQL service container. It never touches production.
# The seed step and the API start command are the two places most likely to need
# adjusting to how this repository is normally run in QA.
name: release-gate

on:
  workflow_dispatch:
  push:
    branches: [skylent/product-truth]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skylent
          POSTGRES_PASSWORD: skylent_qa
          POSTGRES_DB: skylent_qa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skylent" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://skylent:skylent_qa@127.0.0.1:5432/skylent_qa
      DIRECT_URL: postgresql://skylent:skylent_qa@127.0.0.1:5432/skylent_qa
      SESSION_SECRET: qa-only-session-secret-0123456789abcdef0123456789
      FRONTEND_URL: http://127.0.0.1:8443
      COOKIE_SECURE: "false"
      PORT: "3099"
      API_BASE: http://127.0.0.1:3099/api/v1
      # Deterministic lesson-grounded provider: no external AI key is used in the gate.
      SKYLENT_AI_PROVIDER: lesson-grounded
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show the commit under test
        run: |
          git log --oneline -1

      - name: npm ci
        run: npm ci

      - name: Frontend TypeScript
        if: always()
        run: npx tsc --noEmit
      - name: Backend TypeScript
        if: always()
        run: npm run backend:typecheck
      - name: Production build
        if: always()
        run: npm run build

      - name: Prisma validate
        if: always()
        run: npx prisma validate
      - name: Apply existing migrations to the QA database
        if: always()
        run: |
          ls prisma/migrations
          test -d prisma/migrations/20261004000000_skylent_additions
          test -d prisma/migrations/20261004180000_backfill_program_course_links
          test -d prisma/migrations/20261009000000_policy_acceptance
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Seed QA content (courses, lessons, quizzes)
        if: always()
        run: npm run db:seed

      - name: test:production-env
        if: always()
        run: npm run test:production-env
      - name: test:catalog-parity (catalogue truth and seeded catalogue parity)
        if: always()
        run: npm run test:catalog-parity
      - name: Content and path checks (no database)
        if: always()
        run: |
          npm run test:da-content
          npm run test:pm-content
          npm run test:live-intents
          npx tsx scripts/test-dashboard-navigation.ts
          npx tsx scripts/test-dashboard-project-selection.ts
          npx tsx scripts/test-enrollment-access.ts
          npx tsx scripts/test-career-job-eligibility.ts
          npx tsx scripts/test-path-roadmap.ts
          npx tsx scripts/test-path-execution.ts
          npx tsx scripts/test-path-evidence.ts
          npm run test:certificate-verify
          npx tsx scripts/test-google-link.ts
          npm run test:oauth-redirect

      # Every suite signs up its own users. The sign-in rate limit is held in memory at its production
      # default (20 per 15 minutes), so each suite gets a freshly started API instead of a raised limit.
      - name: Start the API
        if: always()
        run: |
          cat > "$RUNNER_TEMP/restart-api.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          if [ -f "$RUNNER_TEMP/api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null || true
            for i in $(seq 1 20); do
              curl -fsS "$API_BASE/health" > /dev/null 2>&1 || break
              sleep 1
            done
          fi
          echo "--- api start $(date -u +%H:%M:%S)" >> api.log
          nohup node server.js >> api.log 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for i in $(seq 1 40); do
            curl -fsS "$API_BASE/health" > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS "$API_BASE/health"
          echo
          SCRIPT
          chmod +x "$RUNNER_TEMP/restart-api.sh"
          "$RUNNER_TEMP/restart-api.sh"

      - name: test:auth
        if: always()
        run: |
          "$RUNNER_TEMP/restart-api.sh"
          npm run test:auth
      - name: test:consent (terms acceptance enforced and recorded by the server)
        if: always()
        run: |
          "$RUNNER_TEMP/restart-api.sh"
          npm run test:consent
      - name: test:roles (role provisioning and authorization fixtures)
        if: always()
        run: |
          "$RUNNER_TEMP/restart-api.sh"
          npm run test:roles
      - name: test:lms
        if: always()
        run: |
          "$RUNNER_TEMP/restart-api.sh"
          npm run test:lms
      - name: test:ai
        if: always()
        run: |
          "$RUNNER_TEMP/restart-api.sh"
          npm run test:ai
      - name: test-product-manifest
        if: always()
        run: npx tsx scripts/test-product-manifest.ts
      - name: test:ai-policy
        if: always()
        run: npm run test:ai-policy
      - name: test:quiz-guard (real PostgreSQL throttle and advisory lock)
        if: always()
        run: |
          "$RUNNER_TEMP/restart-api.sh"
          npm run test:quiz-guard
      - name: test:labs
        if: always()
        run: |
          "$RUNNER_TEMP/restart-api.sh"
          npm run test:labs
      - name: test:labs-sql
        if: always()
        run: |
          "$RUNNER_TEMP/restart-api.sh"
          npm run test:labs-sql
      - name: test:projects
        if: always()
        run: |
          "$RUNNER_TEMP/restart-api.sh"
          npm run test:projects
      - name: test:career
        if: always()
        run: |
          "$RUNNER_TEMP/restart-api.sh"
          npm run test:career
      - name: test:career-evidence
        if: always()
        run: |
          "$RUNNER_TEMP/restart-api.sh"
          npm run test:career-evidence
      - name: Learner journey against the QA API and database
        if: always()
        run: |
          "$RUNNER_TEMP/restart-api.sh"
          npx tsx scripts/qa-learner-journey.ts

      # This one deliberately trips the sign-in rate limit.
      - name: test:security-middleware (CORS, CSRF, body limit, auth rate limit)
        if: always()
        run: |
          "$RUNNER_TEMP/restart-api.sh"
          npm run test:security-middleware

      - name: Client bundle carries no answer keys
        if: always()
        run: |
          ! grep -rl "correctIndex" dist/assets || (echo "correctIndex found in client bundle" && exit 1)

      - name: Inspect the QA database after the run
        if: always()
        run: |
          psql "$DATABASE_URL" -c 'select count(*) as quiz_attempts from "QuizAttempt";'
          psql "$DATABASE_URL" -c 'select count(*) as certificates from "SkylentCertificate";'
          psql "$DATABASE_URL" -c 'select count(*) as enquiries from "SkylentEnquiry";'
          psql "$DATABASE_URL" -c 'select context, count(*) from "PolicyAcceptance" group by context order by context;'

      - name: API log
        if: always()
        run: tail -n 200 api.log || true
