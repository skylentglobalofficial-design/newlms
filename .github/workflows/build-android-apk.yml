name: Build Skylent Android APK & Play Store AAB

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Native Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Standalone UI Bundle
        run: |
          npm install
          npx prisma generate
          npx vite build
          npm install @capacitor/core @capacitor/android --no-save
          npm install -D @capacitor/cli --no-save

      - name: Sync Capacitor Native Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compile Debug APK & Release AAB via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Upload Installable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skylent-playstore-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Play Store Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skylent-playstore-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
