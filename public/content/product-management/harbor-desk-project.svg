  <text x="248" y="288" fill="#8A8F96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Buried in the on-call group. 43 unread.</text>
  <text x="820" y="278" fill="#8A8F96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">BURIED</text>

