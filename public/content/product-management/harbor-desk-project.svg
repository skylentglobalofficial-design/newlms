  <text x="48" y="131" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="500">Inbox</text>
  <text x="48" y="168" fill="#15171A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="500">Weekend queue</text>
  <text x="48" y="204" fill="#5C6168" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="500">Ready for review</text>
  <text x="44" y="250" fill="#8A8F96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" letter-spacing="1.3">OWNER</text>
