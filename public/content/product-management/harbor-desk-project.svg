  <text x="48" y="306" fill="#8A8F96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">HQ operations</text>

  <text x="248" y="96" fill="#8A8F96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" letter-spacing="1.3">OPEN BEFORE 7AM</text>

  <rect x="248" y="110" width="664" height="56" rx="6" fill="#F7F7F8" stroke="#E6E7EA"/>
