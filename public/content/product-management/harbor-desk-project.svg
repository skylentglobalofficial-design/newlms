  <text x="248" y="332" fill="#15171A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="500">Madurai Main - cooler fault</text>
  <text x="248" y="352" fill="#8A8F96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Walkie only. No written trail after the engineer was called.</text>
  <text x="820" y="342" fill="#8A8F96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">WALKIE</text>
