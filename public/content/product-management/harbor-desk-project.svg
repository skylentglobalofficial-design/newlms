  <text x="44" y="49" fill="#15171A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="-0.3">Harbor Desk</text>
  <text x="148" y="49" fill="#8A8F96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="1.4">WEEKEND EXCEPTION QUEUE</text>
