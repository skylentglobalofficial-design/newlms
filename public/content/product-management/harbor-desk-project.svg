  <text x="286" y="134" fill="#15171A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600">T. Nagar - late inbound</text>
  <text x="286" y="154" fill="#5C6168" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">No owner before open. Milk truck missed the 06:30 window.</text>
  <text x="820" y="140" fill="#4F46E5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">UNOWNED</text>

  <line x1="248" y1="180" x2="912" y2="180" stroke="#EEEEF0"/>
  <text x="248" y="204" fill="#15171A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="500">Anna Nagar - delivery failure</text>
  <text x="248" y="224" fill="#8A8F96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Never appeared in a channel. Cashier took it on WhatsApp.</text>
  <text x="820" y="214" fill="#8A8F96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">UNLOGGED</text>

  <line x1="248" y1="244" x2="912" y2="244" stroke="#EEEEF0"/>
