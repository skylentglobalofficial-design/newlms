<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function () {
        var key = "skylent-theme";
        var stored = localStorage.getItem(key);
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = stored === "light" || stored === "dark" ? stored : (systemDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>
      /* Skylent light mode: warm editorial canvas + the same indigo/violet Aurora family. */
      [data-theme="light"] {
        --skylent-canvas: #eee6d8 !important;
        --skylent-surface: #f4ede2 !important;
        --skylent-elevated: #f8f1e6 !important;
        --skylent-glass-bg: rgba(36, 31, 26, 0.035) !important;
        --skylent-text: #181613 !important;
        --skylent-text-secondary: #4b4640 !important;
        --skylent-text-muted: #766f67 !important;
        --skylent-border: rgba(24, 22, 19, 0.12) !important;
        --skylent-border-subtle: rgba(24, 22, 19, 0.075) !important;
        --skylent-accent: #6366f1 !important;
        --skylent-accent-foreground: #f8f1e6 !important;
        --skylent-input-bg: rgba(24, 22, 19, 0.035) !important;
        --skylent-input-border: rgba(24, 22, 19, 0.14) !important;
        --skylent-card-bg: rgba(24, 22, 19, 0.025) !important;
        --skylent-nav-bg: rgba(238, 230, 216, 0.94) !important;
        --skylent-footer-bg: #e5dccd !important;
        --skylent-focus-ring: rgba(99, 102, 241, 0.45) !important;
        --skylent-aurora-opacity: 0.34 !important;
      }

      [data-theme="light"] .skylent-public-canvas {
        background-image:
          radial-gradient(ellipse 58% 42% at 10% 2%, rgba(99, 102, 241, 0.14), transparent 72%),
          radial-gradient(ellipse 48% 38% at 92% 5%, rgba(139, 92, 246, 0.11), transparent 70%) !important;
        background-repeat: no-repeat;
      }
    </style>
    <title>Skylent — Education, Skills, Career</title>
    <meta name="description" content="Skylent is an education technology platform spanning academic education, career-ready skills, and Career OS — for students, parents, and institutions." />
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
