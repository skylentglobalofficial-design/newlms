    <script>
      (function () {
        try {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ("caches" in window) {
            caches.keys().then(function (keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            });
          }
        } catch (e) {}
      })();
    </script>
