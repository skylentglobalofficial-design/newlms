<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5142b5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Skylent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Skylent" />
    <meta name="msapplication-TileColor" content="#5142b5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Skylent — Learn. Practise. Build.</title>
    <meta name="description" content="Learn useful skills, practise through real work, and keep evidence of what you learn." />
    <script>
      (function () {
        try {
          if ("caches" in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) {
                if (k.indexOf("v54") === -1) caches.delete(k);
              });
            });
          }
          window.addEventListener("vite:preloadError", function () {
            if (!sessionStorage.getItem("skylent:chunk-reload")) {
              sessionStorage.setItem("skylent:chunk-reload", "1");
              window.location.reload();
            }
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker on web so Chrome/Edge shows the native YouTube-style Install / Open in app button in the URL address bar
      var isNativeCapacitor = Boolean(
        window.Capacitor ||
        window.location.hostname === "app.skylent.local" ||
        (navigator.userAgent && navigator.userAgent.indexOf("SkylentNativeApp") !== -1)
      );
      if (
        !isNativeCapacitor &&
        "serviceWorker" in navigator &&
        (window.location.protocol === "https:" || window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
      ) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/sw.js?v=55")
            .then(function (reg) {
              reg.update();
            })
            .catch(function () {});
        });
      }
    </script>
    <!-- figma:body-end -->
  </body>
</html>
