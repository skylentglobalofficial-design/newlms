    <style>
      /* Mobile & Android APK Static Text/Layout Lock + Zero Notification-Bar Overlap */
      :root {
        --sky-safe-top: env(safe-area-inset-top, 0px);
        --sky-safe-bottom: env(safe-area-inset-bottom, 0px);
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      html,
      body {
        -webkit-text-size-adjust: 100% !important;
        -moz-text-size-adjust: 100% !important;
        text-size-adjust: 100% !important;
        overflow-x: hidden;
        max-width: 100vw;
      }
      /* Legacy APK without native MainActivity WindowInsets */
      html[data-native-app="true"]:not([data-native-insets="android"]) {
        --sky-safe-top: max(env(safe-area-inset-top, 0px), 28px);
      }
      html[data-native-app="true"]:not([data-native-insets="android"]) body {
        padding-top: var(--sky-safe-top);
      }
      /* V82 APK with native Android WindowInsets on WebView: OS already positions WebView below status bar */
      html[data-native-insets="android"] {
        --sky-safe-top: 0px;
        --sky-safe-bottom: 0px;
      }
      html[data-native-insets="android"] body {
        padding-top: 0 !important;
      }
      html[data-native-app="true"] .auth-shell-topbar {
        top: 0 !important;
      }
      @media (max-width: 900px) {
        .skylent-public-canvas .skn__bar {
          height: 52px !important;
          padding-top: 2px !important;
        }
        .entry-top {
          padding-top: max(var(--sky-safe-top), 10px) !important;
          height: auto !important;
          min-height: 50px !important;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var ua = navigator.userAgent || "";
          var isNative =
            ua.indexOf("SkylentNativeApp") !== -1 ||
            ua.indexOf("; wv") !== -1 ||
            Boolean(window.Capacitor) ||
            (window.location.hostname === "localhost" && /Android|iPhone|iPad/i.test(ua));
          if (isNative) {
            document.documentElement.setAttribute("data-native-app", "true");
            if (ua.indexOf("SkylentNativeInsetsApplied") !== -1) {
              document.documentElement.setAttribute("data-native-insets", "android");
            }
          }
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ("caches" in window) {
            caches.keys().then(function (keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            });
          }
        } catch (e) {}
      })();
    </script>
